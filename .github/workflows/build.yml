name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4          # ← обновил до v4 (рекомендуется)

    - name: Set up JDK 17
      uses: actions/setup-java@v4       # ← тоже обновил
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3  # актуальная версия на 2026
      with:
        sdk-version: '34'
        ndk-version: '27.0.12077973'   # свежий NDK (можно 25.2.9519653 или 27+)

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4   # ← здесь главное изменение
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        if-no-files-found: warn           # или error, если хочешь фейлить билд при отсутствии файла
        retention-days: 7                 # опционально: сколько хранить артефакт (по умолчанию 90)
